<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT N3 漢字｜Lesson 30</title>
<style>
:root{--bg:#f7f5fb;--card:#fff;--ink:#2f2b35;--muted:#6e6676;--accent:#76558f;--line:#ded8e6}
*{box-sizing:border-box} body{margin:0;font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:920px;margin:auto;padding:24px 16px 48px} h1{font-size:26px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-bottom:16px}.kbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:22px;cursor:pointer}.kbtn.active{outline:3px solid #cdb7df}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 22px rgba(50,35,65,.06)}
.learncols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.big{font-size:96px;line-height:1;text-align:center;margin:8px 0 14px}.label{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}.reading{font-size:20px;font-weight:700}.example{font-size:18px}.pt{color:var(--muted)}
#writerTarget{width:220px;height:220px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px}.replay{display:block;margin:10px auto 0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}.credit{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}
canvas{display:block;width:220px;height:220px;border:1px solid var(--line);background:#fff;border-radius:12px;margin:8px auto}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer}
#practice{display:none}.q{font-size:21px;font-weight:700;margin:8px 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{font-size:25px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.feedback{min-height:28px;margin:14px 0;font-weight:700}.next{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}.next:disabled{opacity:.4}
@media(max-width:700px){.grid{grid-template-columns:repeat(5,1fr)}.learncols{grid-template-columns:1fr}.big{font-size:82px}}
</style>
</head><body><div class="wrap">
<h1>JLPT N3 漢字｜Lesson 30</h1><div class="sub">仕・職・求・探・常・識・失・礼・労・員</div>
<div class="tabs"><button id="learnTab" class="tab active">Learn</button><button id="practiceTab" class="tab">Practice</button></div>
<div id="grid" class="grid"></div>
<section id="learn" class="card"><div class="learncols">
<div><div id="big" class="big"></div><div class="label">よみかた</div><div id="reading" class="reading"></div><div class="label">れい</div><div id="example" class="example"></div><div id="pt" class="pt"></div></div>
<div><div class="label" style="text-align:center">かきじゅん</div><div id="writerTarget"></div><button id="replay" class="replay">↻ もういちど</button><div class="credit">KanjiVG © Ulrich Apel, CC BY-SA 3.0</div><div class="label" style="text-align:center">じぶんで かこう</div><canvas id="pad" width="440" height="440"></canvas><div style="text-align:center"><button id="clear" class="smallbtn">けす</button></div></div>
</div></section>
<section id="practice" class="card"><div id="progress" class="pt"></div><div id="q" class="q"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="next" class="next" disabled>Próximo →</button></section>
</div>
<script>
const data=[
 {k:'仕',r:'つか（える）・シ・ジ',ex:'両親に仕（つか）える。',pt:'servir / trabalho'},
 {k:'職',r:'ショク',ex:'天職（てんしょく）に就（つ）く。',pt:'profissão'},
 {k:'求',r:'もと（める）・キュウ',ex:'失業して、あらたに職を求（もと）める。',pt:'procurar / exigir'},
 {k:'探',r:'さぐ（る）・さが（す）・タン',ex:'求人広告を見て、仕事を探（さが）す。',pt:'procurar'},
 {k:'常',r:'つね・とこ・ジョウ',ex:'常（つね）に笑顔をたやさない。',pt:'sempre / normal'},
 {k:'識',r:'シキ',ex:'常識（じょうしき）を身につける。',pt:'conhecimento / consciência'},
 {k:'失',r:'うしな（う）・シツ',ex:'仕事で失敗（しっぱい）した。',pt:'perder / falhar'},
 {k:'礼',r:'レイ・ライ',ex:'お先に失礼（しつれい）します。',pt:'cortesia / saudação'},
 {k:'労',r:'ロウ',ex:'彼女は若いころから苦労（くろう）している。',pt:'trabalho / esforço'},
 {k:'員',r:'イン',ex:'社員食堂で昼食をとる。',pt:'membro / funcionário'}
];
const vg={}; data.forEach(x=>vg[x.k]=x.k.codePointAt(0).toString(16).padStart(5,'0')+'.svg');
let idx=0,round=[],qi=0,answered=false;
const $=id=>document.getElementById(id), grid=$('grid');
data.forEach((d,i)=>{const b=document.createElement('button');b.className='kbtn';b.textContent=d.k;b.onclick=()=>select(i);grid.appendChild(b)});
function select(i){idx=i;[...grid.children].forEach((b,j)=>b.classList.toggle('active',j===i));const d=data[i];$('big').textContent=d.k;$('reading').textContent=d.r;$('example').textContent=d.ex;$('pt').textContent=d.pt;renderKanjiVG(d.k)}
async function renderKanjiVG(ch){const t=$('writerTarget');t.innerHTML='<div style="padding:85px 0;text-align:center;color:#777">loading…</div>';try{const res=await fetch('https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/'+vg[ch]);const doc=new DOMParser().parseFromString(await res.text(),'image/svg+xml');const paths=[...doc.querySelectorAll('g[id*="StrokePaths"] path')];const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 109 109');svg.setAttribute('width','100%');svg.setAttribute('height','100%');paths.forEach(p=>{const g=p.cloneNode();g.setAttribute('fill','none');g.setAttribute('stroke','#e5e1e8');g.setAttribute('stroke-width','3.5');g.setAttribute('stroke-linecap','round');g.setAttribute('stroke-linejoin','round');svg.appendChild(g)});paths.forEach((p,n)=>{const g=p.cloneNode();g.setAttribute('fill','none');g.setAttribute('stroke','#302b35');g.setAttribute('stroke-width','3.5');g.setAttribute('stroke-linecap','round');g.setAttribute('stroke-linejoin','round');const len=220;g.style.strokeDasharray=len;g.style.strokeDashoffset=len;g.style.animation=`draw .55s ease forwards ${n*.55}s`;svg.appendChild(g)});t.innerHTML='';t.appendChild(svg)}catch(e){t.textContent='書き順データを読み込めませんでした。'}}
const st=document.createElement('style');st.textContent='@keyframes draw{to{stroke-dashoffset:0}}';document.head.appendChild(st);$('replay').onclick=()=>renderKanjiVG(data[idx].k);
$('learnTab').onclick=()=>{$('learnTab').classList.add('active');$('practiceTab').classList.remove('active');grid.style.display='grid';$('learn').style.display='block';$('practice').style.display='none'};
$('practiceTab').onclick=()=>{$('practiceTab').classList.add('active');$('learnTab').classList.remove('active');grid.style.display='none';$('learn').style.display='none';$('practice').style.display='block';startPractice()};
const qs=[
 {q:'「つかえる」の「つか」は どのかんじですか？',pt:'servir',a:'仕'},
 {q:'「てんしょく」の「しょく」は どのかんじですか？',pt:'vocação',a:'職'},
 {q:'「もとめる」の「もと」は どのかんじですか？',pt:'procurar',a:'求'},
 {q:'「さがす」の「さが」は どのかんじですか？',pt:'procurar',a:'探'},
 {q:'「つね」のかんじは どれですか？',pt:'sempre',a:'常'},
 {q:'「じょうしき」の「しき」は どのかんじですか？',pt:'bom senso',a:'識'},
 {q:'「しっぱい」の「しっ」は どのかんじですか？',pt:'falha',a:'失'},
 {q:'「しつれい」の「れい」は どのかんじですか？',pt:'com licença',a:'礼'},
 {q:'「くろう」の「ろう」は どのかんじですか？',pt:'dificuldade',a:'労'},
 {q:'「しゃいん」の「いん」は どのかんじですか？',pt:'funcionário',a:'員'}
];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startPractice(){round=shuffle(qs);qi=0;showQ()}
function showQ(){answered=false;$('next').disabled=true;$('feedback').textContent='';const q=round[qi];$('progress').textContent=`${qi+1} / ${round.length}`;$('q').innerHTML=q.q+`<div class="pt" style="font-size:14px;font-weight:400;margin-top:5px">${q.pt}</div>`;let opts=[q.a,...shuffle(data.filter(x=>x.k!==q.a).map(x=>x.k)).slice(0,3)];opts=shuffle(opts);$('choices').innerHTML='';opts.forEach(k=>{const b=document.createElement('button');b.className='choice';b.textContent=k;b.onclick=()=>{if(answered)return;answered=true;if(k===q.a){$('feedback').textContent='○ 正解！'}else{$('feedback').textContent='× 正解：'+q.a}$('next').disabled=false};$('choices').appendChild(b)})}
$('next').onclick=()=>{qi++;if(qi>=round.length){$('q').textContent=round.length+'問 おわりました！';$('choices').innerHTML='';$('feedback').textContent='';$('next').textContent='もういちど';$('next').disabled=false;$('next').onclick=()=>{location.reload()};return}showQ()};
const c=$('pad'),ctx=c.getContext('2d');ctx.lineWidth=10;ctx.lineCap='round';let down=false;function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};c.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};window.onpointerup=()=>down=false;$('clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height);
select(0);
</script></body></html>
